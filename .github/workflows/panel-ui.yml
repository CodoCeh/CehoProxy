name: Safe panel UI verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panel-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set synthetic fixture directory
        run: echo "CEHO_RENDER_DIR=$RUNNER_TEMP/cehoproxy-fixtures" >> "$GITHUB_ENV"
      # The v4 tags below were resolved through GitHub's refs API on 2026-10-03.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/panel-qa/package-lock.json
      - name: Build full solution
        run: dotnet build ProxyCage.sln -c Release
      - name: Audited safe .NET regression tests
        run: |
          filter="$(cat tools/panel-qa/safe-tests.filter)"
          test -n "$filter"
          dotnet test tests/ProxyCage.Core.Tests/ProxyCage.Core.Tests.csproj \
            -c Release --no-build --filter "$filter" \
            --logger "trx;LogFileName=safe-regression.trx" \
            --results-directory tools/panel-qa/artifacts/dotnet
      - name: Verify checked-in product artwork and exact tray template pixels
        run: |
          python3 -m pip install -r tools/branding/requirements.txt
          python3 tools/branding/test_assets.py
          python3 tools/branding/export_tray.py --dotnet dotnet --check
      - name: Render production HTML with synthetic state only
        id: fixture
        run: >-
          dotnet test tests/ProxyCage.Core.Tests/ProxyCage.Core.Tests.csproj
          -c Release --no-build
          --filter FullyQualifiedName~Fixture_pages_can_be_exported_for_visual_review
          --logger "trx;LogFileName=fixture-render.trx"
          --results-directory tools/panel-qa/artifacts/dotnet
      - run: npm ci --prefix tools/panel-qa --ignore-scripts
      - name: Deterministic client script checks
        working-directory: tools/panel-qa
        run: |
          mkdir -p artifacts
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=artifacts/client-junit.xml \
            panel-client.test.mjs
      - name: Install lockfile-pinned Playwright browser
        id: browser_install
        working-directory: tools/panel-qa
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Browser fault-injection and lifecycle checks
        working-directory: tools/panel-qa
        run: node browser-check.mjs
      - name: RU and EN light/dark desktop/mobile screenshot matrix
        if: ${{ always() && steps.fixture.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        working-directory: tools/panel-qa
        env:
          CEHO_SCREENSHOTS: artifacts/screenshots
        run: node inspect.mjs
      - name: Upload synthetic-fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panel-ui-evidence-${{ github.sha }}
          path: |
            tools/panel-qa/artifacts
            !tools/panel-qa/artifacts/screenshots/**
            ${{ runner.temp }}/cehoproxy-fixtures
          if-no-files-found: error
          retention-days: 7
      - name: Upload ru desktop screenshots (bounded artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panel-screenshots-ru-desktop-${{ github.sha }}
          path: |
            tools/panel-qa/artifacts/screenshots/*-ru-desktop-*.png
            tools/panel-qa/artifacts/screenshots/screenshot-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload ru mobile screenshots (bounded artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panel-screenshots-ru-mobile-${{ github.sha }}
          path: |
            tools/panel-qa/artifacts/screenshots/*-ru-mobile-*.png
            tools/panel-qa/artifacts/screenshots/screenshot-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload en desktop screenshots (bounded artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panel-screenshots-en-desktop-${{ github.sha }}
          path: |
            tools/panel-qa/artifacts/screenshots/*-en-desktop-*.png
            tools/panel-qa/artifacts/screenshots/screenshot-results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload en mobile screenshots (bounded artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panel-screenshots-en-mobile-${{ github.sha }}
          path: |
            tools/panel-qa/artifacts/screenshots/*-en-mobile-*.png
            tools/panel-qa/artifacts/screenshots/screenshot-results.json
          if-no-files-found: warn
          retention-days: 7
  safe-platform:
    name: Safe regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            excluded_tests: ''
          - os: windows-latest
            # Existing build.yml exclusions retained; DoctorTests is not allowlisted.
            excluded_tests: 'FullyQualifiedName!=ProxyCage.Core.Tests.PlatformTests.Tun_options_match_the_running_system&FullyQualifiedName!=ProxyCage.Core.Tests.AppIconTests.Linux_icon_name_resolves_inside_the_theme_folders'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build full solution
        run: dotnet build ProxyCage.sln -c Release
      - name: Compile macOS tray bundles without launching or installing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for arch in arm64 x86_64; do
            scripts/build-tray-mac.sh "$arch" "$RUNNER_TEMP/cehoproxy-tray-build-$arch"
          done
      - name: Audited safe .NET and read-only platform regression
        shell: bash
        env:
          EXCLUDED_TESTS: ${{ matrix.excluded_tests }}
        run: |
          filter="$(cat tools/panel-qa/safe-tests.filter)"
          test -n "$filter"
          if [ -n "$EXCLUDED_TESTS" ]; then filter="($filter)&$EXCLUDED_TESTS"; fi
          dotnet test tests/ProxyCage.Core.Tests/ProxyCage.Core.Tests.csproj \
            -c Release --no-build --filter "$filter" \
            --logger "trx;LogFileName=safe-regression.trx" \
            --results-directory artifacts/safe-tests
      - name: Upload platform test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panel-safe-tests-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/safe-tests
          if-no-files-found: error
          retention-days: 7
