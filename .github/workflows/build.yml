name: Сборка и тесты

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

env:
  FLAKY_ONLINE_TESTS: 'FullyQualifiedName!=ProxyCage.Core.Tests.DirectHttpTests.Resolves_github_api_host'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # This review branch runs the explicitly scoped safe-review workflow instead.
    # It does not certify live VPN/firewall/repair behavior or the full platform suite.
    if: github.ref_name != 'feat/verified-panel-reliability-20261003' && github.head_ref != 'feat/verified-panel-reliability-20261003'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            excluded_tests: ''
          - os: macos-latest
            excluded_tests: ''
          - os: windows-latest
            excluded_tests: 'FullyQualifiedName!=ProxyCage.Core.Tests.PlatformTests.Tun_options_match_the_running_system&FullyQualifiedName!=ProxyCage.Core.Tests.AppIconTests.Linux_icon_name_resolves_inside_the_theme_folders&FullyQualifiedName!=ProxyCage.Core.Tests.DoctorTests.A_failed_repair_lands_in_what_is_left_for_the_owner'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановление зависимостей
        run: dotnet restore ProxyCage.sln

      - name: Сборка
        run: dotnet build ProxyCage.sln -c Release --no-restore

      - name: Тесты
        shell: bash
        env:
          EXCLUDED_TESTS: ${{ matrix.excluded_tests }}
        run: |
          filter="$FLAKY_ONLINE_TESTS"
          if [ -n "$EXCLUDED_TESTS" ]; then
            filter="$filter&$EXCLUDED_TESTS"
          fi
          dotnet test ProxyCage.sln -c Release --no-build \
            --filter "$filter" \
            --logger "trx;LogFileName=tests.trx" \
            --results-directory artifacts/tests

      - name: Дымовой тест первой настройки
        shell: bash
        run: python3 tests/smoke/setup_smoke.py || python tests/smoke/setup_smoke.py

      - name: Сборка значка macOS
        if: matrix.os == 'macos-latest'
        run: scripts/build-tray-mac.sh arm64 "$RUNNER_TEMP/tray"

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/tests
          if-no-files-found: warn
          retention-days: 7

  safe-review-scope:
    name: Review scope notice (full live-system suite NOT run)
    if: github.ref_name == 'feat/verified-panel-reliability-20261003' || github.head_ref == 'feat/verified-panel-reliability-20261003'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'This review branch uses the separate safe-review unit and fixture-browser workflow.'
          echo 'Live VPN, firewall, routing, privileged repair, installation and real sleep/WiFi checks remain unrun.'
          echo 'A green safe-review job is NOT a full-suite or release-readiness claim.'
