name: Сборка и тесты

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановление зависимостей
        run: dotnet restore ProxyCage.sln

      - name: Сборка
        run: dotnet build ProxyCage.sln -c Release --no-restore

      - name: Тесты
        run: dotnet test ProxyCage.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/tests
          if-no-files-found: warn
          retention-days: 7
